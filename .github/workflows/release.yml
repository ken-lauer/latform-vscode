name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]

# OIDC federated auth to Entra ID (no long-lived PAT). See the setup notes below.
permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: marketplace-publish
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verify tag matches package.json version
        run: |
          pkg_version="v$(node -p "require('./package.json').version")"
          if [ "$pkg_version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg_version" >&2
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run check-types

      - name: Test
        run: npm test

      - name: Package VSIX
        run: npx vsce package --no-dependencies

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Publish to VS Code Marketplace
        run: npx vsce publish --no-dependencies --packagePath *.vsix --azure-credential --skip-duplicate

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: latform-vsix
          path: "*.vsix"
          if-no-files-found: error
