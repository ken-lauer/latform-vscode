<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#242a40"/>
      <stop offset="1" stop-color="#161a28"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38e8ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8bf5ff" stop-opacity="1"/>
      <stop offset="1" stop-color="#38e8ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- background tile -->
  <rect x="0" y="0" width="128" height="128" rx="26" fill="url(#bg)"/>

  <!-- FODO-style lattice elements straddling the beam axis -->
  <!-- focusing quadrupole (up) -->
  <rect x="20" y="30" width="16" height="34" rx="2" fill="#5aa9ff"/>
  <!-- dipole / bend (centered, amber) -->
  <rect x="56" y="42" width="20" height="44" rx="2" fill="#f6b352"/>
  <!-- defocusing quadrupole (down) -->
  <rect x="92" y="64" width="16" height="34" rx="2" fill="#5aa9ff"/>

  <!-- marker dots -->
  <circle cx="46" cy="64" r="3.5" fill="#6ee7a8"/>
  <circle cx="86" cy="64" r="3.5" fill="#6ee7a8"/>

  <!-- beam axis + glowing particle -->
  <rect x="10" y="62" width="108" height="4" rx="2" fill="url(#beam)"/>
  <circle cx="64" cy="64" r="6" fill="#eafeff"/>
  <circle cx="64" cy="64" r="11" fill="#8bf5ff" fill-opacity="0.28"/>
</svg>
